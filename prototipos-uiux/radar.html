<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weatherly — Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="back" href="index.html">← Protótipos</a>
  <h1 class="page-title">Radar de chuva</h1>
  <p class="page-sub">Roadmap: precipitação em tempo real + timeline</p>

  <div class="phones">
    <div>
      <p class="phone-label">Radar</p>
      <div class="phone">
        <div class="screen rain">
          <div class="statusbar"><span>14:05</span><span>📶 🔋</span></div>

          <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
            <span style="font-size:18px;">←</span>
            <div>
              <div style="font-family:var(--font-display); font-weight:700; font-size:18px;">Radar</div>
              <div style="font-size:12px; color:var(--text-70);">Recife, BR</div>
            </div>
          </div>

          <div class="radar-map">
            <div class="gridline" style="left:33%; top:0; width:1px; height:100%;"></div>
            <div class="gridline" style="left:66%; top:0; width:1px; height:100%;"></div>
            <div class="gridline" style="top:33%; left:0; height:1px; width:100%;"></div>
            <div class="gridline" style="top:66%; left:0; height:1px; width:100%;"></div>
            <div class="pin">📍</div>
          </div>

          <div class="legend">
            <span><i style="background:#5ac878;"></i>Fraca</span>
            <span><i style="background:#3daaff;"></i>Moderada</span>
            <span><i style="background:#2378dc;"></i>Forte</span>
          </div>

          <div class="timeline">
            <span>▶</span>
            <div class="track"></div>
            <span style="color:var(--text-70);">14:20</span>
          </div>

          <div class="alert-banner">
            <span style="font-size:20px;">🌧️</span>
            <div class="body">
              <strong>Chuva chegando em ~25 min</strong>
              Célula de chuva moderada se aproximando do leste. Deve durar cerca de 40 minutos.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
